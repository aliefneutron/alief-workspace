plugins { id 'com.android.application' version '9.1.1' }
android {
 namespace 'id.aliefneutron.studio'
 compileSdk 37
 defaultConfig { applicationId 'id.aliefneutron.studio'; minSdk 28; targetSdk 35; versionCode 19; versionName '3.5.0-dola-merge'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' } }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs=['src']; res.srcDirs=['res']; assets.srcDirs=['assets'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { storeFile file(System.getenv('ALIEF_KEYSTORE') ?: 'E:/Alief-Android-Build/signing/alief-release.jks'); storePassword System.getenv('ALIEF_SIGN_PASSWORD'); keyAlias 'alief'; keyPassword System.getenv('ALIEF_SIGN_PASSWORD') } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 packaging { jniLibs { useLegacyPackaging true } }
}
dependencies { implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254' }
layout.buildDirectory = file(System.getenv('ALIEF_GECKO_BUILD') ?: 'E:/Alief-Gecko-Build/workspace-output')

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
